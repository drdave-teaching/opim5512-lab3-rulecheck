# (touched to re-register the schedule)
# The robot. Every 5 minutes (GitHub may start it late or skip one when busy -
# that's fine, collect.py catches up), it runs both partners' APIs and commits the
# new rows to the `data` branch. Code lives on main (protected, PRs only);
# data lives on `data` (the robot's branch). Run it by hand: Actions -> collect -> Run workflow.
name: collect

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check out the data branch (create it on the first run)
        run: |
          git config --global user.name "lab3-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git worktree add ../databr origin/data
            cd ../databr && git checkout -B data origin/data
          else
            git worktree add --detach ../databr
            cd ../databr && git checkout --orphan data && git rm -rfq .
            echo "# data branch - written by the collect robot every 5 minutes. Code lives on main." > README.md
          fi

      - name: Run both partners' APIs and upsert the rows
        run: python src/collect.py --out ../databr

      - name: Commit and push any new rows
        run: |
          cd ../databr
          git add -A
          if git diff --cached --quiet; then
            echo "No new rows this run."
            exit 0
          fi
          git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push origin data
