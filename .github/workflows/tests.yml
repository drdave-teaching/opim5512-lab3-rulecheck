# Runs the checks in tests/ on every pull request - the green check (or red X)
# your reviewer sees next to the PR. Not built yet = skipped. Built wrong = red X.
name: tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v tests
